name: Update public market snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '29 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public market data
        run: python scripts/update_public.py
      - name: Commit public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public BTC ETH market snapshot"
            git push
          fi
