name: Update public whale aggregates
on:
  workflow_dispatch:
  schedule:
    - cron: '53 */6 * * *'
permissions:
  contents: write
concurrency:
  group: public-whale-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and aggregate public positions
        run: python scripts/update_whales.py
      - name: Build factual Japanese report
        run: python scripts/build_report.py
      - name: Commit aggregate-only data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whales.json reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public whale aggregates"
            git pull --rebase
            git push
          fi
